<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UNO No Mercy</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <section class="top">
        <div>
          <p class="eyebrow">Show 'em No Mercy</p>
          <h1>UNO No Mercy</h1>
        </div>
        <div class="connection" id="connection">Ready</div>
      </section>

      <section class="lobby" id="lobby">
        <div class="panel">
          <h2>Host</h2>
          <label>Name<input id="hostName" maxlength="16" placeholder="Your name"></label>
          <button id="hostBtn">Create room</button>
          <p class="hint" id="hostError"></p>
        </div>
        <div class="panel">
          <h2>Join</h2>
          <label>Name<input id="joinName" maxlength="16" placeholder="Your name"></label>
          <label>Room code<input id="roomInput" maxlength="8" placeholder="ABC123"></label>
          <button id="joinBtn">Join room</button>
          <p class="hint" id="joinError"></p>
        </div>
      </section>

      <section class="wait hidden" id="wait">
        <div class="room-card">
          <p class="eyebrow">Room code</p>
          <div class="room-code" id="roomCode">------</div>
          <button class="secondary" id="copyBtn">Copy code</button>
        </div>
        <div class="panel">
          <h2>Players</h2>
          <div class="waiting-players" id="waitingPlayers"></div>
          <button id="startBtn">Start game</button>
          <p class="hint" id="waitError"></p>
        </div>
      </section>

      <section class="game hidden" id="game">
        <aside class="side">
          <div class="panel compact">
            <h2>Turn Order</h2>
            <div class="turn-order" id="turnOrder"></div>
          </div>
          <div class="panel compact">
            <h2>Players</h2>
            <div class="players" id="players"></div>
          </div>
        </aside>

        <section class="table">
          <div class="status">
            <p id="statusText">Waiting...</p>
            <p id="ruleText"></p>
          </div>
          <div class="piles">
            <button class="deck" id="drawBtn">
              <span id="drawLabel">Draw</span>
              <small id="deckCount">0 cards</small>
            </button>
            <div class="discard" id="discard"></div>
          </div>
          <div class="actions">
            <button class="secondary" id="unoBtn">UNO</button>
            <button class="secondary" id="catchBtn">Catch UNO</button>
          </div>
          <div class="revealed" id="revealed"></div>
        </section>

        <section class="hand-area">
          <div class="hand-head">
            <strong>Your Hand</strong>
            <span id="handCount">0 cards</span>
          </div>
          <div class="hand" id="hand"></div>
        </section>
      </section>

      <section class="log" id="log" aria-live="polite"></section>
    </main>

    <dialog id="colorDialog">
      <form method="dialog" class="dialog-card">
        <h2>Choose a color</h2>
        <div class="color-grid">
          <button value="red" class="color-choice red">Red</button>
          <button value="yellow" class="color-choice yellow">Yellow</button>
          <button value="green" class="color-choice green">Green</button>
          <button value="blue" class="color-choice blue">Blue</button>
        </div>
      </form>
    </dialog>

    <dialog id="targetDialog">
      <form method="dialog" class="dialog-card">
        <h2>Swap with</h2>
        <div class="target-list" id="targetList"></div>
      </form>
    </dialog>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
